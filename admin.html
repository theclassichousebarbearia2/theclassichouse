async function showDashboard(){

      sb.from('barbers').select('*'),
      sb.from('business_hours').select('*'),
      sb.from('barber_shifts').select('*'),
    ]);
    if (svcRes.error) throw svcRes.error;
    if (barRes.error) throw barRes.error;
    services = svcRes.data || [];
    barbers = barRes.data || [];
    businessHours = hrsRes.data || [];
    barberShifts = (!shiftsRes.error && shiftsRes.data) ? shiftsRes.data : [];
  } catch (err) {
    console.error(err);
    document.getElementById('calendar-area').innerHTML =
      `<div class="msg err">Não consegui carregar os dados do Supabase. Confirma o SUPABASE_URL e a chave.</div>`;
    return;
  }

  renderLegend();
  setupCalendarSwipe();

  dateInput.value = toLocalDateStr(new Date());

    dateInput.dataset.listenerAttached = '1';
    dateInput.addEventListener('change', () => loadAgenda(dateInput.value));
  }

  svcSelect.innerHTML = services.map(s => `<option value="${s.id}">${s.name.split('|')[0].trim()} (${euro(s.price_eur)})</option>`).join('');

  const barberSelect = document.getElementById('manual-barber');
  barberSelect.innerHTML = barbers.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

  const manualDateInput = document.getElementById('manual-date');

  manualDateInput.min = todayStr;
  manualDateInput.value = todayStr;
  svcSelect.addEventListener('change', renderManualSlots);
  barberSelect.addEventListener('change', renderManualSlots);

function euro(v){ return v === null || v === undefined ? 'a confirmar' : `€ ${Number(v).toFixed(0)}`; }

const SERVICE_PICKER_COLORS = ['#5da8dd','#e0964a','#69c17e','#b26b8c','#8a6bb2','#c9a227','#4a9b8e'];
function servicePickerCategoryColor(catName){
  const names = [...new Set(services.map(s => s.category))];
  const idx = names.indexOf(catName);
  return SERVICE_PICKER_COLORS[idx % SERVICE_PICKER_COLORS.length];
}
function openServicePicker(){
  document.getElementById('service-picker-modal').classList.remove('hidden');
  const searchEl = document.getElementById('service-picker-search');
  searchEl.value = '';
  searchEl.oninput = (e) => renderServicePickerList(e.target.value);
  renderServicePickerList('');
}
function closeServicePicker(){
  document.getElementById('service-picker-modal').classList.add('hidden');
}
function renderServicePickerList(query){
  const listEl = document.getElementById('service-picker-list');
  const q = query.trim().toLowerCase();
  const currentId = document.getElementById('manual-service').value;
  const byCategory = {};
  services.filter(s => !q || s.name.toLowerCase().includes(q)).forEach(s => { (byCategory[s.category] ||= []).push(s); });
  const catNames = Object.keys(byCategory);
  if (catNames.length === 0) { listEl.innerHTML = '<p style="color:var(--ink-muted);">Nenhum serviço encontrado.</p>'; return; }
  listEl.innerHTML = catNames.map(cat => {
    const list = byCategory[cat];
    const color = servicePickerCategoryColor(cat);
    return `
      <div class="service-cat-title">${cat} <span class="count">${list.length}</span></div>
      ${list.map(s => `
        <div class="service-pick-card ${s.id===currentId?'selected':''}" style="border-left-color:${color};" onclick="selectServiceFromPicker('${s.id}')">
          <div class="service-pick-info">
            <div class="service-pick-name">${s.name.split('|')[0].trim()}</div>
            <div class="service-pick-duration">${s.duration_minutes}min</div>
          </div>
          <div class="service-pick-price">${euro(s.price_eur)}</div>
        </div>
      `).join('')}
    `;
  }).join('');
}
function selectServiceFromPicker(serviceId){
  const svcSelect = document.getElementById('manual-service');
  svcSelect.value = serviceId;
  svcSelect.dispatchEvent(new Event('change'));
  const s = services.find(x => x.id === serviceId);
  document.getElementById('manual-service-btn-label').textContent = s ? `${s.name.split('|')[0].trim()} (${euro(s.price_eur)})` : 'Escolher serviço';
  closeServicePicker();
}
function normalizePhone(p){ return String(p||'').replace(/\D/g,'').slice(-9); }
function toLocalDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function timeStrToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minutesToTimeStr(mins){ const h=Math.floor(mins/60).toString().padStart(2,'0'); const m=(mins%60).toString().padStart(2,'0'); return `${h}:${m}`; }

async function renderManualSlots(preferredMinutes){
  const areaEl = document.getElementById('manual-slots-area');
  manualSelectedSlot = null;
  const serviceId = document.getElementById('manual-service').value;
  const barberId = document.getElementById('manual-barber').value;
  const dateStr = document.getElementById('manual-date').value;
  if (!serviceId || !barberId || !dateStr) { areaEl.innerHTML = ''; return; }

  const service = services.find(s => s.id === serviceId);
  areaEl.innerHTML = '<p style="color:var(--ink-muted); font-size:0.85rem; margin-top:12px;">A verificar disponibilidade…</p>';

  const dow = new Date(dateStr + 'T00:00:00').getDay();
  const hoursRow = businessHours.find(h => h.day_of_week === dow);
  if (!hoursRow || hoursRow.is_closed) {
    areaEl.innerHTML = '<div class="msg err">A barbearia está fechada neste dia.</div>';
    return;
  }

  const dayStart = new Date(dateStr + 'T00:00:00');
  const dayEnd = new Date(dateStr + 'T23:59:59');
  const { data: busy, error } = await sb
    .from('appointments')
    .select('start_time, end_time')
    .eq('barber_id', barberId)
    .neq('status', 'cancelled')
    .gte('start_time', dayStart.toISOString())
    .lte('start_time', dayEnd.toISOString());

  if (error) { areaEl.innerHTML = '<div class="msg err">Erro a verificar disponibilidade.</div>'; console.error(error); return; }

  const openMin = timeStrToMinutes(hoursRow.open_time);
  const closeMin = timeStrToMinutes(hoursRow.close_time);
  const duration = service.duration_minutes;
  const isToday = dateStr === toLocalDateStr(new Date());
  const now = new Date();
  const slots = [];

  for (let start = openMin; start + duration <= closeMin; start += 15) {
    const slotStart = new Date(dateStr + 'T' + minutesToTimeStr(start) + ':00');
    const slotEnd = new Date(slotStart.getTime() + duration*60000);
    if (isToday && slotStart < now) continue;

    const conflict = (busy||[]).some(b => new Date(b.start_time) < slotEnd && new Date(b.end_time) > slotStart);
    if (!conflict) slots.push({ time: minutesToTimeStr(start), start: slotStart, end: slotEnd });
  }

  if (slots.length === 0) {
    areaEl.innerHTML = '<div class="msg err">Sem horários livres para este barbeiro neste dia.</div>';
    return;
  }

  areaEl.innerHTML = '<div class="manual-slots" id="manual-slots-grid"></div>';
  const grid = document.getElementById('manual-slots-grid');
  let closestBtn = null, closestDiff = Infinity;
  slots.forEach(slot => {
    const btn = document.createElement('div');
    btn.className = 'manual-slot-btn';
    btn.textContent = slot.time;
    btn.addEventListener('click', () => {
      manualSelectedSlot = slot;
      document.querySelectorAll('.manual-slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    grid.appendChild(btn);
    if (preferredMinutes !== undefined) {
      const diff = Math.abs(timeStrToMinutes(slot.time) - preferredMinutes);
      if (diff < closestDiff) { closestDiff = diff; closestBtn = btn; }
    }
  });

  if (closestBtn) closestBtn.click();
}

async function openManualFormAt(barberId, dateStr, clickedMin){
  const formEl = document.getElementById('manual-form');
  formEl.classList.remove('hidden');
  document.getElementById('manual-msg').innerHTML = '';
  document.getElementById('manual-date').value = dateStr;
  document.getElementById('manual-barber').value = barberId;

  const shift = shiftForBarberOnDate(barberId, dateStr);
  if (shift && (shift.is_off || !shift.start_time || !shift.end_time)) {
    if (!confirm('Este barbeiro está de folga neste dia. Queres marcar mesmo assim?')) { formEl.classList.add('hidden'); return; }
  } else if (shift && (clickedMin < timeStrToMinutes(shift.start_time) || clickedMin > timeStrToMinutes(shift.end_time))) {
    if (!confirm('Esta hora está fora do turno normal deste barbeiro. Queres marcar mesmo assim?')) { formEl.classList.add('hidden'); return; }
  }

  await renderManualSlots(clickedMin);
  formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function login(){
  const msgEl = document.getElementById('login-msg');
  msgEl.innerHTML = '';
  if (!sb) {

async function showDashboard(){
  document.getElementById('login-view').classList.add('hidden');

      sb.from('business_hours').select('*'),
      sb.from('barber_shifts').select('*'),

function euro(v){ return v === null || v === undefined ? 'a confirmar' : `€ ${Number(v).toFixed(0)}`; }

const SERVICE_PICKER_COLORS = ['#5da8dd','#e0964a','#69c17e','#b26b8c','#8a6bb2','#c9a227','#4a9b8e'];
function servicePickerCategoryColor(catName){
  const names = [...new Set(services.map(s => s.category))];
  const idx = names.indexOf(catName);
  return SERVICE_PICKER_COLORS[idx % SERVICE_PICKER_COLORS.length];
}
function openServicePicker(){
  document.getElementById('service-picker-modal').classList.remove('hidden');
  const searchEl = document.getElementById('service-picker-search');
  searchEl.value = '';
  searchEl.oninput = (e) => renderServicePickerList(e.target.value);
  renderServicePickerList('');
}
function closeServicePicker(){
  document.getElementById('service-picker-modal').classList.add('hidden');
}
function renderServicePickerList(query){
  const listEl = document.getElementById('service-picker-list');
  const q = query.trim().toLowerCase();
  const currentId = document.getElementById('manual-service').value;
  const byCategory = {};
  services.filter(s => !q || s.name.toLowerCase().includes(q)).forEach(s => { (byCategory[s.category] ||= []).push(s); });
  const catNames = Object.keys(byCategory);
  if (catNames.length === 0) { listEl.innerHTML = '<p style="color:var(--ink-muted);">Nenhum serviço encontrado.</p>'; return; }
  listEl.innerHTML = catNames.map(cat => {
    const list = byCategory[cat];
    const color = servicePickerCategoryColor(cat);
    return `
      <div class="service-cat-title">${cat} <span class="count">${list.length}</span></div>
      ${list.map(s => `
        <div class="service-pick-card ${s.id===currentId?'selected':''}" style="border-left-color:${color};" onclick="selectServiceFromPicker('${s.id}')">
          <div class="service-pick-info">
            <div class="service-pick-name">${s.name.split('|')[0].trim()}</div>
            <div class="service-pick-duration">${s.duration_minutes}min</div>
          </div>
          <div class="service-pick-price">${euro(s.price_eur)}</div>
        </div>
      `).join('')}
    `;
  }).join('');
}

function normalizePhone(p){ return String(p||'').replace(/\D/g,'').slice(-9); }
function toLocalDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function switchTab(tab){
  ['agenda','relatorios','clientes','assinantes','catalogo','marketing'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if(el) el.classList.toggle('hidden', t !== tab);
    const topBtn = document.querySelector(`.tab-btn[data-tab="${t}"]`);

    const sideBtn = document.querySelector(`.mobile-nav-link[data-tab="${t}"]`);

  if (tab === 'clientes') loadClients();

function timeStrToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minutesToTimeStr(mins){ const h=Math.floor(mins/60).toString().padStart(2,'0'); const m=(mins%60).toString().padStart(2,'0'); return `${h}:${m}`; }

async function renderManualSlots(preferredMinutes){
  const areaEl = document.getElementById('manual-slots-area');
  manualSelectedSlot = null;
  const serviceId = document.getElementById('manual-service').value;
  const barberId = document.getElementById('manual-barber').value;
  const dateStr = document.getElementById('manual-date').value;
  if (!serviceId || !barberId || !dateStr) { areaEl.innerHTML = ''; return; }

  const service = services.find(s => s.id === serviceId);
  areaEl.innerHTML = '<p style="color:var(--ink-muted); font-size:0.85rem; margin-top:12px;">A verificar disponibilidade…</p>';

  const dow = new Date(dateStr + 'T00:00:00').getDay();
  const hoursRow = businessHours.find(h => h.day_of_week === dow);
  if (!hoursRow || hoursRow.is_closed) {
    areaEl.innerHTML = '<div class="msg err">A barbearia está fechada neste dia.</div>';
    return;
  }

  const dayStart = new Date(dateStr + 'T00:00:00');
  const dayEnd = new Date(dateStr + 'T23:59:59');
  const { data: busy, error } = await sb
    .from('appointments')
    .select('start_time, end_time')
    .eq('barber_id', barberId)
    .neq('status', 'cancelled')
    .gte('start_time', dayStart.toISOString())
    .lte('start_time', dayEnd.toISOString());

  if (error) { areaEl.innerHTML = '<div class="msg err">Erro a verificar disponibilidade.</div>'; console.error(error); return; }

  const openMin = timeStrToMinutes(hoursRow.open_time);
  const closeMin = timeStrToMinutes(hoursRow.close_time);
  const duration = service.duration_minutes;
  const isToday = dateStr === toLocalDateStr(new Date());
  const now = new Date();
  const slots = [];

  for (let start = openMin; start + duration <= closeMin; start += 15) {
    const slotStart = new Date(dateStr + 'T' + minutesToTimeStr(start) + ':00');
    const slotEnd = new Date(slotStart.getTime() + duration*60000);
    if (isToday && slotStart < now) continue;

    const conflict = (busy||[]).some(b => new Date(b.start_time) < slotEnd && new Date(b.end_time) > slotStart);
    if (!conflict) slots.push({ time: minutesToTimeStr(start), start: slotStart, end: slotEnd });
  }

  if (slots.length === 0) {
    areaEl.innerHTML = '<div class="msg err">Sem horários livres para este barbeiro neste dia.</div>';
    return;
  }

  areaEl.innerHTML = '<div class="manual-slots" id="manual-slots-grid"></div>';
  const grid = document.getElementById('manual-slots-grid');
  let closestBtn = null, closestDiff = Infinity;
  slots.forEach(slot => {
    const btn = document.createElement('div');
    btn.className = 'manual-slot-btn';
    btn.textContent = slot.time;
    btn.addEventListener('click', () => {
      manualSelectedSlot = slot;
      document.querySelectorAll('.manual-slot-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    grid.appendChild(btn);
    if (preferredMinutes !== undefined) {
      const diff = Math.abs(timeStrToMinutes(slot.time) - preferredMinutes);
      if (diff < closestDiff) { closestDiff = diff; closestBtn = btn; }
    }
  });

  if (closestBtn) closestBtn.click();
}

async function openManualFormAt(barberId, dateStr, clickedMin){
  const formEl = document.getElementById('manual-form');
  formEl.classList.remove('hidden');
  document.getElementById('manual-msg').innerHTML = '';
  document.getElementById('manual-date').value = dateStr;
  document.getElementById('manual-barber').value = barberId;

  const shift = shiftForBarberOnDate(barberId, dateStr);
  if (shift && (shift.is_off || !shift.start_time || !shift.end_time)) {
    if (!confirm('Este barbeiro está de folga neste dia. Queres marcar mesmo assim?')) { formEl.classList.add('hidden'); return; }
  } else if (shift && (clickedMin < timeStrToMinutes(shift.start_time) || clickedMin > timeStrToMinutes(shift.end_time))) {
    if (!confirm('Esta hora está fora do turno normal deste barbeiro. Queres marcar mesmo assim?')) { formEl.classList.add('hidden'); return; }
  }

  await renderManualSlots(clickedMin);
  formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
